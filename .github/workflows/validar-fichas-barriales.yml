name: Validar botón y generador de fichas barriales
on:
  push:
    branches: [main]
    paths: ['assets/fichas-barriales.js', 'index.html', 'assets/styles.css', '.github/workflows/validar-fichas-barriales.yml']
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis JavaScript
        run: node --check assets/fichas-barriales.js && node --check assets/app.js
      - name: Verificar integración del botón y archivos
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text()
          js=Path('assets/fichas-barriales.js').read_text()
          css=Path('assets/styles.css').read_text()
          assert h.count('id="download-barrio-pdf"')==1
          assert 'src="assets/fichas-barriales.js?v=2.0-editorial"' in h
          assert 'jspdf.umd.min.js' in h
          assert 'barrioRiskIntersect' in js
          assert "entriesFor(info,'actividad2026')" in js
          assert "entriesFor(info,'tratamientos2026')" in js
          assert 'ficha-download-btn' in css
          assert 'download-barrio-ready' in h
          print('Integración estática y sintaxis: correcta')
          PY
      - name: Instalar navegador de prueba
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Probar PDF de los 342 barrios y sectores
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pot-server.log 2>&1 &
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({acceptDownloads:true});
            page.setDefaultTimeout(45000);
            page.on('pageerror',e=>console.log('PAGEERROR',e.message));
            try{
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>typeof state!=='undefined'&&state.barrios.length>300&&!!state.resumen,{timeout:60000});
              const cases=await page.evaluate(()=>state.barrios.map(f=>({codigo:String(f.properties.codigo),nombre:f.properties.barrio})).sort((a,b)=>a.codigo.localeCompare(b.codigo)));
              console.log('TOTAL DE BARRIOS A PROBAR',cases.length);
              const errors=[];
              for(const t of cases){
                await page.evaluate(code=>{const f=state.barrios.find(b=>String(b.properties.codigo)===code);setSelected(f,null,false);pageTo('mapa',false)},t.codigo);
                const btn=page.locator('#download-barrio-pdf');
                await btn.click({timeout:12000});
                await page.waitForFunction(code=>{const a=document.getElementById('download-barrio-ready');return a&&!a.hidden&&a.download.includes(code)&&a.href.startsWith('blob:')},t.codigo,{timeout:30000});
                const info=await page.evaluate(async ()=>{
                  const a=document.getElementById('download-barrio-ready');
                  if(!a||a.hidden||!a.href.startsWith('blob:'))return {error:'Enlace al PDF no disponible'};
                  const blob=await (await fetch(a.href)).blob();
                  const h=new TextDecoder().decode(await blob.slice(0,4).arrayBuffer());
                  return {bytes:blob.size,header:h,filename:a.download};
                });
                if(info.error||info.header!=='%PDF'||!info.filename.includes(t.codigo)||info.bytes<5000){
                  errors.push(t.codigo+': '+JSON.stringify(info));
                  console.log('FALLA',t.codigo,t.nombre,JSON.stringify(info));
                }else{
                  console.log('OK',t.codigo,t.nombre,info.bytes,info.filename);
                  if(t.codigo==='1722'){
                    const data=await page.evaluate(async ()=>{
                      const buf=await (await fetch(document.getElementById('download-barrio-ready').href)).arrayBuffer();
                      const bytes=new Uint8Array(buf);let str='';
                      for(let i=0;i<bytes.length;i+=8192)str+=String.fromCharCode(...bytes.slice(i,i+8192));
                      return btoa(str);
                    });
                    require('fs').writeFileSync('/tmp/ficha_1722.pdf',Buffer.from(data,'base64'));
                  }
                }
              }
              console.log('TOTAL',cases.length,'FALLAS',errors.length);if(errors.length)throw Error('Barrios con falla: '+JSON.stringify(errors));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Verificar píxeles del mapa de amenaza en PDF
        run: |
          pip install pymupdf pillow
          python - <<'PY'
          import fitz
          from PIL import Image
          from io import BytesIO
          pdf=fitz.open('/tmp/ficha_1722.pdf')
          assert len(pdf)==5, f'Número de páginas inesperado: {len(pdf)}'
          page=pdf[3]
          txt=page.get_text()
          assert 'INUNDACIÓN' in txt and 'Alta' in txt, 'No se imprimieron los indicadores de inundación'
          transition=pdf[1].get_text()
          assert 'POT 2014:' in transition and 'Propuesta 2026:' in transition, 'No se identifica origen y destino de transición'
          assert '\\x00' not in transition and '\\ufffd' not in transition, 'Texto corrupto en transiciones'
          from collections import Counter
          # Verificar que los textos de la página 2 no se monten verticalmente:
          blocks=[b for b in pdf[1].get_text('blocks') if b[4].strip()]
          for i,a in enumerate(blocks):
            for b in blocks[i+1:]:
              ax0,ay0,ax1,ay1,*_=a; bx0,by0,bx1,by1,*_=b
              overlap_x=min(ax1,bx1)-max(ax0,bx0)
              overlap_y=min(ay1,by1)-max(ay0,by0)
              if overlap_x>18 and overlap_y>4 and (ay1-ay0)>3 and (by1-by0)>3:
                # Los bloques de diferentes filas no deben superponerse.
                assert not (overlap_x>25 and overlap_y>6), f'Solapamiento texto PDF 2: {a[4][:45]} / {b[4][:45]}'
          pix=page.get_pixmap(matrix=fitz.Matrix(2,2),alpha=False)
          im=Image.open(BytesIO(pix.tobytes('png'))).convert('RGB')
          # El mapa de la primera columna ocupa aproximadamente 14-71 mm x 85-128 mm.
          # El borde del mapa es azul; el rojo debe venir de polígonos de amenaza ALTA.
          pts=0
          for yy in range(int(85/297*im.height),int(128/297*im.height)):
            for xx in range(int(15/210*im.width),int(71/210*im.width)):
              R,G,B=im.getpixel((xx,yy))
              if R>140 and R>G*1.25 and R>B*1.2 and G<155 and B<155:
                pts+=1
          print('Píxeles rojos de amenaza alta en mapa PDF:',pts)
          assert pts>250, 'El mapa de inundación continúa sin polígonos coloreados'
          PY
