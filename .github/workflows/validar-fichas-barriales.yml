name: Validar fichas barriales de cuatro paginas
on:
  push:
    branches: [main, fichas-cuatro-paginas-todos-barrios-20261125]
    paths: ['assets/fichas-barriales.js', 'assets/app.js', 'data/normativa_gestion.json', 'index.html', '.github/workflows/validar-fichas-barriales.yml']
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar JS y enlace de descarga
        run: |
          node --check assets/fichas-barriales.js
          node --check assets/app.js
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          js=Path('assets/fichas-barriales.js').read_text()
          assert html.count('id="download-barrio-pdf"')==1
          assert 'fichas-barriales.js?v=4.' in html
          assert "pdf.getNumberOfPages()!==4" in js
          assert "barrioRiskIntersect(barrio,'condicion_riesgo')" in js
          assert "getThreat(barrio)" in js
          assert "state.microzonasBarrio" in js
          assert "state.normas" in js
          print('Integración dinámica de cuatro páginas: verificada')
          PY
      - name: Instalar navegador
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Verificar generación y descarga de todos los barrios
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pot-server.log 2>&1 &
          node - <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({acceptDownloads:true});
            page.setDefaultTimeout(45000);
            const errors=[];
            try{
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>typeof state!=='undefined'&&state.barrios.length>300&&!!state.resumen&&!!state.normas,{timeout:60000});
              const cases=await page.evaluate(()=>state.barrios.map(f=>({code:String(f.properties.codigo),name:f.properties.barrio})).sort((a,b)=>a.code.localeCompare(b.code)));
              console.log('BARRIOS Y SECTORES',cases.length);
              if(cases.length<340)throw Error('Listado territorial incompleto');
              for(const t of cases){
                try{
                  await page.evaluate(code=>{const b=state.barrios.find(f=>String(f.properties.codigo)===code);setSelected(b,null,false);pageTo('mapa',false)},t.code);
                  await page.click('#download-barrio-pdf',{timeout:12000});
                  await page.waitForFunction(code=>{const a=document.getElementById('download-barrio-ready');return a&&!a.hidden&&a.href.startsWith('blob:')&&a.download.includes(code)},t.code,{timeout:35000});
                  const info=await page.evaluate(async()=>{
                    const a=document.getElementById('download-barrio-ready');
                    const blob=await (await fetch(a.href)).blob();
                    const head=new TextDecoder().decode(await blob.slice(0,4).arrayBuffer());
                    return {size:blob.size,head,file:a.download};
                  });
                  if(info.head!=='%PDF'||info.size<4500||!info.file.includes(t.code))throw Error(JSON.stringify(info));
                  if(['0216','1722','1113'].includes(t.code)){
                    const buf=await page.evaluate(async()=>{
                      const b=await(await fetch(document.getElementById('download-barrio-ready').href)).arrayBuffer();
                      const u=new Uint8Array(b);let s='';
                      for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.slice(i,i+8192));
                      return btoa(s);
                    });
                    fs.writeFileSync('/tmp/ficha_'+t.code+'.pdf',Buffer.from(buf,'base64'));
                  }
                  console.log('OK',t.code,t.name,info.size);
                }catch(e){errors.push(t.code+': '+String(e.message||e));console.log('ERROR',t.code,String(e.message||e))}
              }
              console.log('TOTAL',cases.length,'ERRORES',errors.length);
              if(errors.length)throw Error(errors.slice(0,30).join('\n'));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Verificar contenido y exactamente cuatro páginas
        run: |
          pip install pymupdf
          python - <<'PY'
          import fitz
          samples={}
          for code in ['0216','1722','1113']:
              pdf=fitz.open('/tmp/ficha_'+code+'.pdf')
              assert len(pdf)==4,(code,'Número de páginas',len(pdf))
              pages=[p.get_text() for p in pdf]
              assert 'ENTIENDE EL CAMBIO' in pages[0],code
              assert 'CÓMO SE TRANSFORMA' in pages[1],code
              assert 'AMENAZAS CUANTIFICADAS' in pages[2],code
              assert 'MICROZONIFICACIÓN Y RIESGO' in pages[3],code
              assert 'INSTRUMENTOS Y OBLIGACIONES' in pages[1],code
              assert code in pages[0],code
              for i,p in enumerate(pdf):
                  assert f'{i+1} / 4' in p.get_text(),(code,i)
                  assert p.get_images(),(code,i,'no hay contenido gráfico en página')
              samples[code]='\n'.join(pages)
              print(code,'4 páginas OK',sum(len(x) for x in pages))
          assert 'Desarrollo urbano' in samples['0216'] and '16 %' in samples['0216'], 'D2 de Menga no aparece'
          assert 'Consolidación moderada' in samples['0216'], 'C3 de Menga no aparece'
          assert samples['0216']!=samples['1722'], 'Las fichas no son específicas'
          print('Comprobaciones normativas, páginas y especificidad: OK')
          PY