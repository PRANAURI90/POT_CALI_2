name: Validar botón y generador de fichas barriales
on:
  push:
    branches: [main]
    paths: ['assets/fichas-barriales.js', 'index.html', 'assets/styles.css', '.github/workflows/validar-fichas-barriales.yml']
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis JavaScript
        run: node --check assets/fichas-barriales.js && node --check assets/app.js
      - name: Verificar integración del botón y archivos
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text()
          js=Path('assets/fichas-barriales.js').read_text()
          css=Path('assets/styles.css').read_text()
          assert h.count('id="download-barrio-pdf"')==1
          assert 'src="assets/fichas-barriales.js?v=1.0"' in h
          assert 'jspdf.umd.min.js' in h
          assert 'barrioRiskIntersect' in js
          assert "entriesFor(info,'actividad2026')" in js
          assert "entriesFor(info,'tratamientos2026')" in js
          assert 'ficha-download-btn' in css
          print('Integración estática y sintaxis: correcta')
          PY
      - name: Instalar navegador de prueba
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Probar varios barrios y registrar errores
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pot-server.log 2>&1 &
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({acceptDownloads:true});
            page.setDefaultTimeout(45000);
            page.on('pageerror',e=>console.log('PAGEERROR',e.message));
            try{
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>typeof state!=='undefined'&&state.barrios.length>300&&!!state.resumen,{timeout:60000});
              const cases=await page.evaluate(()=>{
                const arr=state.barrios;const sorted=[...arr].sort((a,b)=>String(a.properties.codigo).localeCompare(String(b.properties.codigo)));
                const picks=[sorted[0],sorted[20],sorted[70],sorted[130],sorted[200],sorted[270],sorted[340],arr.find(f=>String(f.properties.codigo)==='1722')];
                return picks.filter(Boolean).map(f=>({codigo:String(f.properties.codigo),nombre:f.properties.barrio}));
              });
              console.log('BARRIOS A PROBAR',JSON.stringify(cases));
              const errors=[];
              for(const t of cases){
                await page.evaluate(code=>{const f=state.barrios.find(b=>String(b.properties.codigo)===code);setSelected(f,null,false);pageTo('mapa',false)},t.codigo);
                const btn=page.locator('#download-barrio-pdf');
                const dl=page.waitForEvent('download',{timeout:90000}).then(x=>x).catch(e=>null);
                await btn.click();
                const file=await dl;
                const status=await page.locator('#download-barrio-status').innerText();
                if(file){
                  const fs=require('fs');const filePath='/tmp/ficha_'+t.codigo+'.pdf';
                  await file.saveAs(filePath);const buf=fs.readFileSync(filePath);
                  console.log('OK',t.codigo,t.nombre,buf.length,status);
                  if(!buf.subarray(0,4).equals(Buffer.from('%PDF')))errors.push(t.codigo+' PDF no válido');
                }else{
                  errors.push(t.codigo+': '+status);
                  console.log('FALLA',t.codigo,t.nombre,status);
                }
              }
              if(errors.length)throw Error('Barrios con falla: '+JSON.stringify(errors));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Verificar píxeles del mapa de amenaza en PDF
        run: |
          pip install pymupdf pillow
          python - <<'PY'
          import fitz
          from PIL import Image
          from io import BytesIO
          pdf=fitz.open('/tmp/ficha_1722.pdf')
          assert len(pdf)==4, f'Número de páginas inesperado: {len(pdf)}'
          page=pdf[2]
          txt=page.get_text()
          assert 'INUNDACIÓN' in txt and 'Alta' in txt, 'No se imprimieron los indicadores de inundación'
          pix=page.get_pixmap(matrix=fitz.Matrix(2,2),alpha=False)
          im=Image.open(BytesIO(pix.tobytes('png'))).convert('RGB')
          # El mapa de la primera columna ocupa aproximadamente 14-71 mm x 85-128 mm.
          # El borde del mapa es azul; el rojo debe venir de polígonos de amenaza ALTA.
          pts=0
          for yy in range(int(85/297*im.height),int(128/297*im.height)):
            for xx in range(int(15/210*im.width),int(71/210*im.width)):
              R,G,B=im.getpixel((xx,yy))
              if R>140 and R>G*1.25 and R>B*1.2 and G<155 and B<155:
                pts+=1
          print('Píxeles rojos de amenaza alta en mapa PDF:',pts)
          assert pts>250, 'El mapa de inundación continúa sin polígonos coloreados'
          PY
